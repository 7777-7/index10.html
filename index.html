<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap');
  :root {
    --pink: #e91e8c;
    --dark-pink: #c01570;
    --green: #00c853;
    --white: #ffffff;
    --shadow: 0 4px 20px rgba(233,30,140,0.1);

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: var(--white);
    padding: 20px;
    padding-bottom: 80px;
  }
  .hero {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, rgba(233,30,140,0.15), rgba(192,21,112,0.08));
    border-radius: 20px;
    border: 1px solid rgba(233,30,140,0.25);
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(233,30,140,0.03) 0%, transparent 60%);
    animation: pulse 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  
  .dev-badge-top {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .dev-badge-top span {
    color: var(--pink);
    font-weight: 700;
  }

  .hero h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(22px,5vw,40px);
    font-weight: 900;
    color: var(--white);
    text-shadow: 0 0 20px rgba(233,30,140,0.6);
    margin-bottom: 8px;
  }
  .hero h1 span { color: var(--pink); }
  .hero p { color: rgba(255,255,255,0.7); font-size: 15px; }
  .stats-bar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 0; }
  .stat {
    background: rgba(233,30,140,0.15);
    border: 1px solid rgba(233,30,140,0.3);
    border-radius: 50px;
    padding: 6px 16px; font-size: 13px; font-weight: 700; color: var(--pink);
  }
  
  .controls {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 20px; margin-bottom: 20px;
    display: flex; gap: 16px; flex-direction: row; align-items: flex-end; justify-content: space-between;

  .control-group { display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .control-group label { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 600; }
  .control-group select, .control-group input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(233,30,140,0.3);
    border-radius: 10px; color: var(--white);
    padding: 11px 14px; font-family: 'Cairo', sans-serif; font-size: 14px; outline: none;
    width: 100%;
  }
  .control-group select:focus, .control-group input:focus { border-color: var(--pink); }
  .control-group select option { background: #302b63; color: white; }
  
  .buttons-group {
    display: flex;
    gap: 10px;
    align-self: flex-end;
  }
  .btn-show {
    background: linear-gradient(135deg, var(--pink), var(--dark-pink));
    border: none; border-radius: 10px; color: white;
    padding: 11px 24px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow); white-space: nowrap; min-height: 45px;
  }
  .btn-show:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(233,30,140,0.3); }
  
  .btn-all {
    background: linear-gradient(135deg, #302b63, #24243e);
    border: 1px solid rgba(233,30,140,0.5); border-radius: 10px; color: white;
    padding: 11px 24px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    white-space: nowrap; min-height: 45px;
  }
  .btn-all:hover { transform: translateY(-2px); border-color: var(--pink); box-shadow: var(--shadow); }

  .model-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: rgba(255,255,255,0.6);
    padding: 6px 12px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .tab-btn:hover { background: rgba(233,30,140,0.15); border-color: var(--pink); color: white; }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--pink), var(--dark-pink));
    border-color: var(--pink); color: white; box-shadow: 0 3px 12px rgba(233,30,140,0.3);
  }
  
  .results-area { display: none; }
  .results-area.visible { display: block; }
  
  .model-title-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 12px;
  }
  .model-title {
    font-size: 20px; font-weight: 900; color: var(--pink);
    text-shadow: 0 0 15px rgba(233,30,140,0.4); margin-bottom: 0;
  }
  .btn-toggle-all {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(233, 30, 140, 0.4);
    color: white; padding: 6px 14px; border-radius: 8px;
    font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-toggle-all:hover { background: var(--pink); border-color: var(--pink); box-shadow: var(--shadow); }

  .questions-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 11px;
  }
  
  .q-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 13px; padding: 13px 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    content-visibility: auto;
    contain-intrinsic-size: 140px;
  }
  .q-card:hover { border-color: rgba(233,30,140,0.4); background: rgba(233,30,140,0.04); }
  .q-header { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .q-num {
    background: linear-gradient(135deg, var(--pink), var(--dark-pink));
    border-radius: 7px; color: white; font-weight: 900; font-size: 13px;
    min-width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .model-badge-inline {
    font-size: 11px; color: rgba(255,200,120,0.8); margin-right: 4px; font-weight: 600;
  }
  .q-answer { display: flex; align-items: center; gap: 6px; margin-bottom: 8px;}
  .answer-badge {
    background: rgba(0,200,83,0.15); border: 1px solid rgba(0,200,83,0.4);
    border-radius: 6px; color: var(--green); font-weight: 900; font-size: 15px; padding: 2px 10px;
  }
  .answer-text { color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; flex: 1; line-height: 1.4; }
  
  .btn-analysis {
    background: rgba(253, 233, 242, 0.04);
    border: 1px dashed rgba(233, 30, 140, 0.3);
    color: rgba(255, 255, 255, 0.8);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    text-align: center;
  }
  .btn-analysis:hover {
    background: rgba(233, 30, 140, 0.12);
    border-color: var(--pink);
    color: #fff;
  }
  .btn-analysis.active {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
    font-weight: 700;
  }

  .q-reason {
    display: none;
    font-size: 12px; color: #ffca50; margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.08); line-height: 1.6;
  }
  .q-reason::before { content: '💡 السبب: '; color: var(--pink); font-weight: 700; }
  
  .no-results { text-align: center; padding: 40px; color: rgba(255,255,255,0.4); font-size: 18px; grid-column: 1 / -1; }
  footer {

  .floating-contacts {
    position: fixed;
    bottom: 25px;
    left: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 9999;
  }
  .social-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;

    .model-title-container { flex-direction: column; text-align: center; }
  }
</style>
